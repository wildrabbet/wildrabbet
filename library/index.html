.filters{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0 25px}.filter{cursor:pointer;border:2px solid var(--line);background:var(--card);padding:8px 12px;font:700 13px Verdana,sans-serif;box-shadow:3px 3px 0 var(--line)}.filter[aria-pressed=true]{color:white;background:var(--teal);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.summary{font:700 13px Verdana,sans-serif;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{position:relative;background:var(--card);border:2px solid var(--line);padding:18px 18px 16px;box-shadow:5px 5px 0 var(--line);min-height:145px;animation:rise .32s both}.card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--red)}.tag{display:inline-block;padding:3px 7px;background:var(--gold);border:1px solid var(--line);font:700 11px Verdana,sans-serif;text-transform:uppercase;letter-spacing:.08em}.card h2{font-size:21px;line-height:1.05;margin:13px 0 10px}.card a{color:var(--ink);text-decoration-thickness:2px;text-decoration-color:var(--red);text-underline-offset:3px}.creator{font:12px Verdana,sans-serif;color:#615d55}.empty{padding:40px;border:2px dashed var(--line);background:var(--card);font-size:20px}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:650px){header{padding-top:36px}.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}h1{font-size:50px}}
</style>
</head>

const CATEGORIES=['All','2D','3D','Music & Audio','Tools','Games','Other'];
let active='All';
const grid=document.querySelector('#grid'),filters=document.querySelector('#filters'),search=document.querySelector('#search'),sort=document.querySelector('#sort'),summary=document.querySelector('#summary');
const escapeHtml=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
for(const category of CATEGORIES){const count=category==='All'?PRODUCTS.length:PRODUCTS.filter(p=>p.category===category).length;const b=document.createElement('button');b.className='filter';b.textContent=category+' · '+count;b.setAttribute('aria-pressed',category===active);b.onclick=()=>{active=category;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};filters.appendChild(b)}
function render(){const q=search.value.trim().toLowerCase();let rows=PRODUCTS.filter(p=>(active==='All'||p.category===active)&&(!q||(p.title+' '+p.creator).toLowerCase().includes(q)));const mode=sort.value;if(mode==='az')rows.sort((a,b)=>a.title.localeCompare(b.title));if(mode==='za')rows.sort((a,b)=>b.title.localeCompare(a.title));if(mode==='category')rows.sort((a,b)=>a.category.localeCompare(b.category)||a.title.localeCompare(b.title));if(mode==='creator')rows.sort((a,b)=>a.creator.localeCompare(b.creator)||a.title.localeCompare(b.title));summary.textContent='Showing '+rows.length+' of '+PRODUCTS.length+' products';grid.innerHTML=rows.length?rows.map((p,i)=>'<article class="card" style="animation-delay:'+Math.min(i*12,180)+'ms"><span class="tag">'+escapeHtml(p.category)+'</span><h2><a href="'+p.url+'" target="_blank" rel="noopener">'+escapeHtml(p.title)+'</a></h2><div class="creator">by '+escapeHtml(p.creator)+'</div></article>').join(''):'<div class="empty">No products match this view.</div>'}
search.addEventListener('input',render);sort.addEventListener('change',render);render();
</script>
